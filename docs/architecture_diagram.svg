<line class="arr" x1="465" y1="100" x2="465" y2="122" marker-end="url(#arrow)"/>

<rect class="wrap" x="40" y="124" width="600" height="202" rx="8" style="stroke:#993C1D"/>
<text class="th" x="340" y="142" text-anchor="middle" style="fill:#712B13">ClickHouse - primary database</text>
<g class="co">
<rect x="100" y="155" width="230" height="55" rx="4"/>
<text class="th" x="215" y="176" text-anchor="middle">Raw events</text>
<text class="ts" x="215" y="194" text-anchor="middle">ad_events table, MergeTree</text>
<rect x="350" y="155" width="230" height="55" rx="4"/>
<text class="th" x="465" y="176" text-anchor="middle">Segment metrics</text>
