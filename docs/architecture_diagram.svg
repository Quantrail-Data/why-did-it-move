<rect x="350" y="40" width="230" height="60" rx="4"/>
<text class="th" x="465" y="63" text-anchor="middle">Streaming events</text>
<text class="ts" x="465" y="81" text-anchor="middle">Live HTTP POST to backend</text>
</g>

