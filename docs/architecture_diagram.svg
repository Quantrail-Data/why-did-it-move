<text class="th" x="340" y="652" text-anchor="middle" style="fill:#72243E">Frontend - React + Vite + Tailwind</text>
<g class="pk">
<rect x="100" y="665" width="230" height="55" rx="4"/>
<text class="th" x="215" y="686" text-anchor="middle">Metric tree</text>
