<text class="th" x="215" y="666" text-anchor="middle">Metric tree</text>
<text class="ts" x="215" y="684" text-anchor="middle">All metrics at a glance</text>
<rect x="350" y="645" width="230" height="55" rx="4"/>
<text class="th" x="465" y="666" text-anchor="middle">Flagged anomalies</text>
