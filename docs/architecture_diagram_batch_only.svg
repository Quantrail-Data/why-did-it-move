<text class="th" x="340" y="43" text-anchor="middle">Batch files</text>
<text class="ts" x="340" y="61" text-anchor="middle">Parquet/CSV via bulk loader</text>
</g>

<line class="arr" x1="340" y1="80" x2="340" y2="102" marker-end="url(#arrow)"/>

<rect class="wrap" x="40" y="104" width="600" height="202" rx="8" style="stroke:#993C1D"/>
<text class="th" x="340" y="122" text-anchor="middle" style="fill:#712B13">ClickHouse - primary database</text>
<g class="co">
<rect x="100" y="135" width="230" height="55" rx="4"/>
<text class="th" x="215" y="156" text-anchor="middle">Raw events</text>
<text class="ts" x="215" y="174" text-anchor="middle">ad_events table, MergeTree</text>
<rect x="350" y="135" width="230" height="55" rx="4"/>
<text class="th" x="465" y="156" text-anchor="middle">Segment metrics</text>
<text class="ts" x="465" y="174" text-anchor="middle">Materialized view, auto-agg</text>
<rect x="100" y="205" width="230" height="55" rx="4"/>
<text class="th" x="215" y="226" text-anchor="middle">Investigations</text>
<text class="ts" x="215" y="244" text-anchor="middle">Diagnosis history log</text>
<rect x="350" y="205" width="230" height="55" rx="4"/>
<text class="th" x="465" y="226" text-anchor="middle">Chat log</text>
<text class="ts" x="465" y="244" text-anchor="middle">Follow-up Q&amp;A history</text>
