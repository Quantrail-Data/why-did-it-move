<svg width="100%" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Why Did It Move - architecture diagram (batch ingestion)</title>
<desc>Batch files feed ClickHouse, which stores raw events, auto-aggregated segment metrics, investigation history and chat logs. A FastAPI backend reads and writes ClickHouse to run detection, investigation, chat and LLM narration, tracing every LLM call to Langfuse. The backend serves a React frontend showing the metric tree, flagged anomalies, anomaly history and investigation detail, which exports a client-generated PDF report.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect{stroke-width:1}
.arr{stroke:#5F5E5A;stroke-width:1.3;fill:none}
.arrd{stroke:#5F5E5A;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
.wrap{fill:#ffffff;stroke:#888780;stroke-width:1.3;stroke-dasharray:5 4}
.gy rect{fill:#F1EFE8;stroke:#888780}.gy .th{fill:#444441}.gy .ts{fill:#5F5E5A}
.co rect{fill:#FAECE7;stroke:#D85A30}.co .th{fill:#712B13}.co .ts{fill:#993C1D}
.pu rect{fill:#EEEDFE;stroke:#7F77DD}.pu .th{fill:#3C3489}.pu .ts{fill:#534AB7}
.te rect{fill:#E1F5EE;stroke:#1D9E75}.te .th{fill:#085041}.te .ts{fill:#0F6E56}
.pk rect{fill:#FBEAF0;stroke:#D4537E}.pk .th{fill:#72243E}.pk .ts{fill:#993556}
</style>

